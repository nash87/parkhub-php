# Mergify config — merge queue + auto-merge on label.
#
# Operator action required after this lands: install/enable Mergify
# on the nash87/parkhub-php repo via the Mergify dashboard. Until
# the GitHub App is enabled, this file is inert.
#
# Docs: https://docs.mergify.com/

queue_rules:
  - name: default
    # Aligned with the CI + CodeQL workflows. Update these names if the
    # workflow filenames or job names in `.github/workflows/` change, and
    # keep the list in sync with branch-protection's required checks.
    queue_conditions:
      - check-success=CI
      - check-success=CodeQL
      - "#review-threads-unresolved=0"
    merge_method: squash

pull_request_rules:
  - name: auto-merge on label
    conditions:
      - label=auto-merge
      - base=main
    actions:
      queue:
        name: default

  - name: dismiss stale reviews on push
    conditions:
      - base=main
    actions:
      dismiss_reviews:
        approved: from_author
        changes_requested: false

  - name: delete head branch after merge
    conditions:
      - merged
    actions:
      delete_head_branch: {}
