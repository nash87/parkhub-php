# Lefthook config — local-first CI for parkhub-php
#
# Goal: catch 90%+ of CI failures before push so the GitHub Actions
# round-trip (15-30 min) is reserved for genuinely cross-cutting checks.
#
# Pre-commit runs only on staged files and stays fast (<10s typical).
# Pre-push verifies the canonical fop-backed local PR gate report. Keep the
# hook fast: Git opens the remote receive-pack connection before this hook, so
# a 10-minute build here can make github.com close the idle SSH session before
# the push starts. Run `make ci` before `git push`; the hook only checks the
# success report for the current HEAD and then starts deferred attestation.
#
# Bypass in emergencies with `git push --no-verify`. Logged + frowned-upon.
# Full local replay: `lefthook run pre-push`.

min_version: 1.7.0

pre-commit:
  parallel: true
  commands:
    fmt-php:
      glob: "**/*.php"
      run: ./vendor/bin/pint --test {staged_files}
      stage_fixed: true
      fail_text: "Pint format violations. Fix with: ./vendor/bin/pint"

    lint-ts:
      glob: "parkhub-web/**/*.{ts,tsx,js,jsx}"
      root: "parkhub-web/"
      # Skip cleanly until Biome is installed; the previous version ran
      # `npx --no-install biome check` even when @biomejs/biome was missing,
      # which silently no-op'd the gate on fresh clones.
      skip:
        - run: test ! -d node_modules/@biomejs/biome
      run: npx --no-install biome check --no-errors-on-unmatched {staged_files}
      stage_fixed: true
      fail_text: "Biome found issues. Run `cd parkhub-web && npx biome check --write` to auto-fix."

    typecheck-ts:
      root: parkhub-web/
      glob: "parkhub-web/**/*.{ts,tsx}"
      # tsc --noEmit is project-wide; we cannot pass {staged_files}
      # because TS resolves the whole module graph. Still cheap (~5s).
      # Skip clauses keep the gate non-fatal on fresh clones — without
      # them `npx tsc` would silently fall back to npm-package "tsc"@2.0.4
      # (Steve Sanderson's 2014 transpiler shim) which exits 0 unconditionally.
      skip:
        - run: test ! -f ../node_modules/typescript/package.json
      run: npx --no-install tsc --noEmit
      fail_text: "TypeScript errors in parkhub-web. Run `npm install` at the root if typescript is missing."

pre-push:
  parallel: false
  commands:
    local-ci:
      # Checks for a nido-local-ci success report (.nido/reports/ first,
      # .fop/reports/ compat fallback). Accepts both nido/local-ci/pr and
      # fop/local-ci/pr context values during the transition period.
      run: bash scripts/check-local-ci-report.sh pr
      fail_text: "Local nido CI report missing or stale. Run `make ci`, then push again."

    workflow-drift:
      # Advisory check: warns if .github/workflows/* and .gitea/workflows/*
      # have drifted (missing files OR different `on:` triggers OR different
      # `jobs:` keys). Mirror of parkhub-rust's pre-push drift gate. Only
      # fails on missing files (gating); trigger/job drift exits 0 since
      # gitea-runner and github-actions intentionally diverge in places.
      run: bash scripts/local-workflow-drift.sh
      fail_text: |
        Workflow file missing in one side. Either add the corresponding file
        in .gitea/workflows/ or .github/workflows/, or document the split in
        scripts/local-workflow-drift.sh's EXEMPT list.

    post-attestation:
      # Forks a deferred poll-and-post that waits until the SHA shows up
      # on GitHub (after `git push` transmits the commit) and then
      # publishes BOTH nido/local-ci/pr (canonical) and fop/local-ci/pr
      # (compat) statuses. Returns immediately so lefthook isn't blocked.
      # The local-ci-attestation gate in .github/workflows/ci.yml accepts
      # either context and typically clears within ~10s of the status post.
      # Env vars: NIDO_LOCAL_CI_* primary; FOP_LOCAL_CI_* are compat fallbacks.
      skip:
        - run: 'test ! -x "$(command -v gh 2>/dev/null)"'
      run: 'bash scripts/post-attestation-deferred.sh success "Local-first attestation - lefthook pre-push gates clean (php)"'

    image-scan:
      # Local container image vulnerability scan — fleet parity port from
      # parkhub-rust + fop-web-ui#171 + fop-web-backend#62. Gating only on
      # changes to files that drive image content (Dockerfile,
      # composer.lock, parkhub-web/package-lock.json) so most pushes hit
      # the cached stamp and skip in milliseconds.
      #
      # Skips entirely when podman/trivy/grype are missing on PATH (the
      # script handles tool detection internally and exits 0). Bazzite
      # devs and CI runners with the tools installed get the gate; others
      # see a one-line skip notice.
      glob: "{Dockerfile,composer.lock,parkhub-web/package-lock.json}"
      skip:
        - run: 'test ! -x scripts/local-image-scan.sh'
      run: ./scripts/local-image-scan.sh
      fail_text: |
        Container image scan surfaced CRITICAL/HIGH vulnerabilities.
        Triage with: trivy image parkhub-php-local:ci-* (see scripts/local-image-scan.sh)
