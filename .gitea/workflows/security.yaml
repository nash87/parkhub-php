# Mirror of .github/workflows/security.yml for Gitea Actions runner.
# Action refs rewritten to https://192.168.178.233/actions/* where mirrored.
# Edit .github/workflows/security.yml as source-of-truth, then re-mirror.

name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22.12.0'

# Default shell to bash so 'set -euo pipefail' works in step scripts —
# act_runner's default 'sh' is dash/BusyBox which doesn't support pipefail.
defaults:
  run:
    shell: bash

jobs:
  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://192.168.178.233/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # TODO(gitea-mirror): No mirror at https://192.168.178.233/shivammathur/setup-php yet.
      # Pin upstream until we mirror; revisit when Gitea mirror lands.

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Audit production dependencies
        run: composer audit --locked --no-dev

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://192.168.178.233/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: https://192.168.178.233/actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit root npm dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high
        continue-on-error: true

      - name: Audit Astro npm dependencies
        run: npm audit --prefix parkhub-web --package-lock-only --omit=dev --audit-level=high
        continue-on-error: true

  trivy-fs:
    name: Trivy Filesystem Scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: https://192.168.178.233/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: https://192.168.178.233/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      # We invoke the gitleaks binary directly (MIT, github.com/gitleaks/gitleaks).
      # The wrapper action gitleaks/gitleaks-action is published under a proprietary
      # EULA since v2 and would violate our commercial-safe license doctrine.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks detect --source=. --redact --verbose --no-banner \
              --log-opts="--no-merges $BASE_SHA..$HEAD_SHA"
          else
            gitleaks detect --source=. --redact --verbose --no-banner
          fi

  zizmor:
    name: Zizmor (GHA SAST, audit-mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Audit-mode: surface findings as informational; do NOT fail the gate yet.
    # Promote findings to errors once the workflow inventory has been triaged.
    continue-on-error: true
    permissions:
      contents: read   # read-only — zizmor only needs to parse workflow YAMLs
    env:
      ZIZMOR_VERSION: 1.24.1
    steps:
      - uses: https://192.168.178.233/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false   # zizmor: ignore[artipacked] — read-only

      # zizmor binary directly (MIT, github.com/zizmorcore/zizmor).
      - name: Install zizmor
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/zizmor.tar.gz -C /tmp zizmor
          sudo mv /tmp/zizmor /usr/local/bin/zizmor
          zizmor --version

      - name: Run zizmor
        run: |
          set -euo pipefail
          # auditor persona surfaces low-severity findings; --no-online-audits
          # avoids GitHub API rate-limit issues when running from Gitea.
          zizmor --persona=auditor --no-online-audits .github/workflows/ .gitea/workflows/ || true

  osv-scanner:
    name: OSV-Scanner (supply-chain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read   # read-only — only parses lockfiles
    env:
      OSV_SCANNER_VERSION: 2.3.5
    steps:
      - uses: https://192.168.178.233/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false   # zizmor: ignore[artipacked] — read-only

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run osv-scanner
        run: |
          set -euo pipefail
          osv-scanner scan source --recursive --no-config . || true

  grype:
    name: Grype (vuln scan, defense-in-depth)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read   # read-only — Grype scans the filesystem
    env:
      GRYPE_VERSION: 0.111.1
    steps:
      - uses: https://192.168.178.233/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false   # zizmor: ignore[artipacked] — read-only

      - name: Install grype
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/grype.tar.gz -C /tmp grype
          sudo mv /tmp/grype /usr/local/bin/grype
          grype --version

      - name: Run grype
        run: |
          set -euo pipefail
          grype dir:. --fail-on critical || true

  trivy-image:
    # SOTA-2026 image scanning — Trivy (Apache-2.0) + Grype (Apache-2.0).
    # The published image only exists after docker-publish.yaml runs on main,
    # so this job is skipped for PRs.
    name: Trivy + Grype image scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read         # checkout for .trivyignore
      packages: read         # pull image from GHCR
      security-events: write # upload Trivy SARIF
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:latest
      GRYPE_VERSION: 0.111.1
    steps:
      - uses: https://192.168.178.233/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false   # zizmor: ignore[artipacked] — read-only

      - name: Log in to GHCR (read-only)
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload Trivy image SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Install grype
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/grype.tar.gz -C /tmp grype
          sudo mv /tmp/grype /usr/local/bin/grype
          grype --version

      - name: Run Grype image scan (defense-in-depth)
        env:
          IMAGE: ${{ env.IMAGE_REF }}
        run: |
          set -euo pipefail
          grype "registry:${IMAGE}" --only-fixed --fail-on critical -o table || true
