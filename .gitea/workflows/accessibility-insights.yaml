name: Accessibility Insights
# Microsoft Accessibility Insights Action — runs FastPass + needs-review
# checks on top of axe-core, producing the IGT (Instrumented Guided Tests)
# WCAG 2.1 AA report that pushes axe's ~57% coverage closer to real
# WCAG conformance. Layered on top of any axe-core Playwright job — does
# not replace it.
#
# License: MIT (microsoft/accessibility-insights-action). Safe to consume.
#
# Compat note (Gitea runner): the upstream action is on github.com.
# Gitea runner_act resolves `github.com` action refs natively when the
# runner has internet egress; mirror to Gitea if air-gapped.
#
# Soft-fail (continue-on-error: true) for the first month while we tune
# the static-site-dir / url config and triage IGT-only findings.
#
# Pattern lifted from fop-web-ui/.gitea/workflows/accessibility-insights.yaml.

on:
  pull_request:
    branches: [main]
    paths:
      - 'parkhub-web/**'
      - '.gitea/workflows/accessibility-insights.yaml'
  push:
    branches: [main]
    paths:
      - 'parkhub-web/**'
      - '.gitea/workflows/accessibility-insights.yaml'
  workflow_dispatch:

concurrency:
  group: accessibility-insights-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  CI: 'true'
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

# Default shell to bash so 'set -euo pipefail' works in step scripts —
# act_runner's default 'sh' is dash/BusyBox which doesn't support pipefail.
defaults:
  run:
    shell: bash

jobs:
  accessibility-insights:
    name: Accessibility Insights (FastPass + needs-review)
    runs-on: ubuntu-latest
    container:
      image: 192.168.178.250:5000/gitea/runner-images@sha256:056f41b214d06e42289a7b2918950e46e9394e855ca056c88b8131a5f0761557
      options: --add-host=gitea.test:192.168.178.233
    timeout-minutes: 30
    continue-on-error: true # Soft-fail for first month — IGT findings still triaging.
    defaults:
      run:
        working-directory: parkhub-web
    steps:
      - uses: https://192.168.178.233/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: https://192.168.178.233/actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: parkhub-web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        # Insights Action requires a Chromium binary via `chrome-path`. Use
        # Playwright's bundled one to guarantee a 2026-era version with the
        # full WCAG 2.1 AA rule set. SOTA-2026 (T-2280): actions/cache@v4 is
        # not mirrored to private Gitea — install fresh per run (~30s extra).
        run: npx --no-install playwright install --with-deps chromium

      - name: Build Astro site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Resolve Chromium path
        id: chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROMIUM_BIN=$(find "${PLAYWRIGHT_BROWSERS_PATH}" -name 'chrome' -type f 2>/dev/null | head -n1 || true)
          if [ -z "${CHROMIUM_BIN}" ]; then
            CHROMIUM_BIN=$(find "${PLAYWRIGHT_BROWSERS_PATH}" -name 'headless_shell' -type f 2>/dev/null | head -n1 || true)
          fi
          if [ -z "${CHROMIUM_BIN}" ]; then
            echo "Could not locate Playwright Chromium binary under ${PLAYWRIGHT_BROWSERS_PATH}" >&2
            exit 1
          fi
          echo "path=${CHROMIUM_BIN}" >> "$GITHUB_OUTPUT"

      - name: Run Accessibility Insights
        # Reference: https://github.com/microsoft/accessibility-insights-action
        # MIT license. Pinned from refs/tags/v3 for Gitea mirror hygiene.
        uses: microsoft/accessibility-insights-action@ecfbbc29c9a7f745ffd7ef8517b4cda6a59d4409
        with:
          # `static-site-dir` makes the action serve the built Astro output
          # (no separate preview server needed) on a localhost port of its
          # choosing. `single-worker: true` gives deterministic crawl
          # ordering for stable diffs.
          static-site-dir: parkhub-web/dist
          static-site-url-relative-path: '/'
          chrome-path: ${{ steps.chromium.outputs.path }}
          output-dir: _accessibility-reports
          max-urls: 25
          single-worker: true
          scan-timeout: 120000
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Accessibility Insights report
        if: always()
        # SOTA-2026 (T-2280): @v4 uses a GHES-incompatible artifact API
        # not yet served by Gitea Actions. Pinned to the v3 commit.
        uses: https://192.168.178.233/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: accessibility-insights-${{ github.run_number }}
          path: parkhub-web/_accessibility-reports/
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "## Accessibility Insights - WCAG 2.1 AA scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f _accessibility-reports/index.html ]; then
            echo "- Report: _accessibility-reports/index.html (download artifact)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No report produced (action may have failed early)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f _accessibility-reports/results.sarif ]; then
            FAIL_COUNT=$(grep -c '"level": "error"' _accessibility-reports/results.sarif 2>/dev/null || echo 0)
            echo "- SARIF errors: ${FAIL_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          fi
