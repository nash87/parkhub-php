name: Lost Pixel
# Whole-page + Storybook visual regression for parkhub-web (Astro + React).
# Mirrors the fop-web-ui pattern — soft-fail, diffs uploaded as artefacts.
# Run on push/main and manual dispatch only; PR runs are too slow for the
# merge train (each shot is ~3-5s and we cover 8 routes + every Storybook
# story).
#
# License: lost-pixel is MIT (https://github.com/lost-pixel/lost-pixel).
# Pattern lifted from fop-web-ui/.gitea/workflows/lost-pixel.yaml.

on:
  push:
    branches: [main]
    paths:
      - 'parkhub-web/**'
      - 'lostpixel.config.ts'
      - '.gitea/workflows/lost-pixel.yaml'
  workflow_dispatch:

concurrency:
  group: lost-pixel-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  CI: 'true'
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

# Default shell to bash so 'set -euo pipefail' works in step scripts —
# act_runner's default 'sh' is dash/BusyBox which doesn't support pipefail.
defaults:
  run:
    shell: bash

jobs:
  lost-pixel:
    name: Lost Pixel (pages + Storybook)
    runs-on: ubuntu-latest
    container:
      image: 192.168.178.250:5000/gitea/runner-images:ubuntu-latest
      options: --add-host=gitea.test:192.168.178.212
    timeout-minutes: 30
    continue-on-error: true # Diffs surface as artefacts, never block.
    # Gated until lostpixel.config.ts lands at repo root and the
    # lost-pixel devDep + baseline snapshots are committed (T-22XX
    # follow-up). Without the config, `npx lost-pixel` exits with a
    # config-not-found error on every run.
    if: vars.LOST_PIXEL_ENABLED == 'true'
    defaults:
      run:
        working-directory: parkhub-web
    steps:
      - uses: http://192.168.178.212:3000/actions/checkout@v4

      - uses: http://192.168.178.212:3000/actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: parkhub-web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright (chromium only)
        # SOTA-2026 (T-2280): actions/cache@v4 is not mirrored to private
        # Gitea — install fresh per run (~30s extra).
        run: npx --no-install playwright install --with-deps chromium

      - name: Build Astro site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Storybook
        run: npm run build-storybook

      - name: Start preview server
        # `astro preview` defaults to :4321. Backgrounded so the next step
        # (lost-pixel) can crawl it. `wait-on` is in parkhub-web devDeps —
        # `--no-install` keeps it reproducible and avoids fetching whatever
        # floats on npm at runtime.
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 &
          npx --no-install wait-on tcp:4321 --timeout 60000

      - name: Run Lost Pixel
        # Config lives at repo root (../lostpixel.config.ts) and references
        # parkhub-web/storybook-static + the running preview on :4321.
        # lost-pixel is not a devDep — pin a specific version with --yes
        # so the CLI is reproducible without polluting package.json.
        working-directory: ${{ github.workspace }}
        run: npx --yes lost-pixel@3.20.0

      - name: Upload diffs
        if: always()
        working-directory: ${{ github.workspace }}
        # SOTA-2026 (T-2280): @v4 uses a GHES-incompatible artifact API
        # not yet served by Gitea Actions. @v3 is the last GHES-compat tag.
        uses: http://192.168.178.212:3000/actions/upload-artifact@v3
        with:
          name: lost-pixel-diffs-${{ github.run_number }}
          path: |
            .lost-pixel/difference/
            .lost-pixel/current/
          retention-days: 14

      - name: Summary
        if: always()
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Lost Pixel - visual regression" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d .lost-pixel/difference ]; then
            DIFF_COUNT=$(find .lost-pixel/difference -type f -name '*.png' 2>/dev/null | wc -l)
            echo "- Diff images: $DIFF_COUNT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No diffs produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -d .lost-pixel/current ]; then
            CUR_COUNT=$(find .lost-pixel/current -type f -name '*.png' 2>/dev/null | wc -l)
            echo "- Current snapshots: $CUR_COUNT" >> "$GITHUB_STEP_SUMMARY"
          fi
