name: Install Smoke
on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC nightly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-compose:
    name: Cold-install Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Smoke test only checks out and runs Docker Compose locally; no GHCR push,
    # no GitHub API writes — read-only is sufficient.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Cold clone
        run: |
          git clone --depth 1 https://github.com/nash87/parkhub-php.git /tmp/smoke
      - name: Follow INSTALLATION.md Docker Compose steps
        working-directory: /tmp/smoke
        # GitHub-hosted runners cannot reach the homelab internal registry
        # (192.168.178.250:5000). Override the Dockerfile defaults via env vars
        # consumed by docker-compose.yml's build args block, pointing at public
        # images that match the same Wolfi/Node major versions.
        env:
          # Pin NODE_BASE to the same sha256 the Dockerfile defaults to so
          # cloud + homelab smoke tests run on byte-identical bytes.
          # WOLFI_BASE stays tag-only because Chainguard's continuous-CVE
          # patching model recommends `:latest`.
          NODE_BASE: docker.io/library/node:22-slim@sha256:aa8ccf90d87e2e60804816ddd256480a42f5cf3cafadf30618be606e4b894104
          WOLFI_BASE: cgr.dev/chainguard/wolfi-base:latest
        run: |
          # Step 2 — seed required secrets
          {
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -base64 24)"
            echo "MYSQL_PASSWORD=$(openssl rand -base64 24)"
            echo "DB_PASSWORD=$(openssl rand -base64 24)"
            echo "PARKHUB_ADMIN_EMAIL=admin@example.com"
            echo "PARKHUB_ADMIN_PASSWORD=$(openssl rand -base64 24)"
          } > .env
          # Align MYSQL_PASSWORD with DB_PASSWORD so app and db agree
          sed -i "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=$(grep '^DB_PASSWORD=' .env | cut -d= -f2-)|" .env
          # Step 4 — start
          docker compose up -d
          # Step 5 — verify
          for i in {1..60}; do
            if curl -sf http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "READY after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: /api/health never green"
          docker compose logs
          exit 1
      - name: Teardown
        if: always()
        working-directory: /tmp/smoke
        run: docker compose down -v
