name: Helm Chart

on:
  pull_request:
    paths:
      - 'helm/**'
      - '.github/workflows/helm.yml'
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/helm.yml'

permissions:
  contents: read

env:
  # Dummy app key for template rendering only (chart requires config.appKey).
  CI_APP_KEY: 'base64:Q0lfREVGQVVMVF9URVNUX0FQUF9LRVlfTk9UX0ZPUl9QUk9EVUNUSU9OX1VTRQ=='

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.16.4'
      - name: helm lint
        run: helm lint helm/parkhub --set config.appKey="$CI_APP_KEY"
      - name: helm template (default values)
        run: helm template release helm/parkhub --set config.appKey="$CI_APP_KEY" > /tmp/rendered-default.yaml
      - name: helm template (grafana opt-in)
        run: helm template release helm/parkhub --set config.appKey="$CI_APP_KEY" --set grafana.dashboardsEnabled=true > /tmp/rendered-grafana.yaml
      - name: helm template (pdb + topology enabled)
        run: helm template release helm/parkhub --set config.appKey="$CI_APP_KEY" --set pdb.enabled=true > /tmp/rendered-ha.yaml
      - name: helm template (ServiceMonitor enabled)
        run: helm template release helm/parkhub --set config.appKey="$CI_APP_KEY" --set monitoring.serviceMonitor.enabled=true > /tmp/rendered-servicemonitor.yaml
      - name: helm template (PrometheusRule enabled)
        run: helm template release helm/parkhub --set config.appKey="$CI_APP_KEY" --set monitoring.prometheusRule.enabled=true > /tmp/rendered-prometheusrule.yaml
      - name: helm template (digest image)
        run: |
          helm template release helm/parkhub --set config.appKey="$CI_APP_KEY" --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            | grep -F 'ghcr.io/nash87/parkhub-php@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
      - name: Validate rendered YAML
        run: |
          for f in /tmp/rendered-*.yaml; do
            yq eval-all '.' "$f" > /dev/null || { echo "YAML parse failed in $f"; exit 1; }
          done
