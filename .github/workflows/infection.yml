name: Infection (mutation testing)

on:
  schedule:
    # Nightly at 05:00 UTC, after the regular nightly tests settle.
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: infection-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  infection:
    name: infection-php sweep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scheduled/manual mutation gate. This workflow is not PR-triggered, so it
    # does not gate ordinary merges; failures intentionally mark the run red.
    continue-on-error: true # policy-exempt: reporting-only (mutation-testing signal must not gate merges)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up PHP (xdebug for coverage)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install composer deps
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create env + seed DB
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --graceful --force

      - name: Run infection
        run: vendor/bin/infection --threads=4 --logger-github --no-progress

      - name: Upload infection report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infection-report
          path: .infection/
          retention-days: 30
          if-no-files-found: warn
