name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Top-level permissions are minimal; the job below declares its own
# read-only scope for an explicit defense-in-depth.
permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Copilot setup steps (PHP + Node + dependency install)
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout source; setup steps install deps only, no writes
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, sqlite3, pdo_sqlite, gd, zip, curl
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install root npm dependencies
        run: npm ci

      - name: Install ParkHub web dependencies
        run: cd parkhub-web && npm ci

      - name: Install resources web dependencies
        if: ${{ hashFiles('resources/js/package-lock.json') != '' }}
        run: cd resources/js && npm ci
