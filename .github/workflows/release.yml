name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Per-job permissions are set below. Keep top-level minimal.
permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22.12.0'

jobs:
  validate-tag:
    name: Validate release ref + version surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Require v* tag ref
        run: |
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            echo "workflow_dispatch must target a v* tag ref"
            exit 1
          fi

      - name: Check release version parity
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          tag = os.environ["GITHUB_REF_NAME"].strip()
          expected = tag[1:] if tag.startswith("v") else tag

          version_file = pathlib.Path("VERSION").read_text().strip()
          web_package = json.loads(pathlib.Path("parkhub-web/package.json").read_text())["version"]

          mismatches = []
          if version_file != expected:
              mismatches.append(f"VERSION={version_file}")
          if web_package != expected:
              mismatches.append(f"parkhub-web/package.json={web_package}")

          if mismatches:
              raise SystemExit(
                  "Release version mismatch for tag "
                  f"{tag}: expected {expected}, got " + ", ".join(mismatches)
              )
          PY
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [validate-tag]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, curl, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        # Note: cache: npm intentionally omitted in release pipeline.
        # Reproducibility > speed for release jobs; no cache I/O on this path.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6 # zizmor: ignore[cache-poisoning] cache: npm not set; no cache I/O on release path
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Trivy for CD preflight
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node dependencies for CD preflight
        run: |
          npm ci
          npm ci --prefix parkhub-web

      - name: Install Playwright Chromium for CD preflight
        run: npx playwright install --with-deps chromium

      - name: Run CD pre-release gate
        run: make release-preflight

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # action-gh-release publishes the GitHub Release + asset uploads to the v* tag
      actions: read   # required for wait-for-check to poll the sibling docker-publish workflow

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Wait for the sibling docker-publish workflow to complete BEFORE
      # publishing release notes. Without this, the GitHub Release ships
      # with a download link for an image that isn't yet in GHCR — users
      # see "image not found" errors for ~5 min after every release.
      #
      # Cross-workflow `needs:` is not supported in GitHub Actions, so we
      # poll for the docker-publish job's check status on the same ref.
      - name: Wait for container image publish
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be # v1.2.0
        timeout-minutes: 35
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: 'Build, scan, and publish image'
          ref: ${{ github.sha }}
          intervalSeconds: 20
          timeoutSeconds: 1800

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          generate_release_notes: true
          draft: false
