name: Feature Request
description: Suggest a new feature for ParkHub
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      placeholder: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: How should this work?
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New module
        - Enhancement to existing module
        - API change
        - UI/UX improvement
        - Documentation
        - DevOps/CI
  - type: checkboxes
    id: spec_written
    attributes:
      label: Spec
      options:
        - label: >-
            I have created (or will create before opening the implementation PR)
            a spec file at `specs/<feature-id>/spec.md`.
            See [specs/README.md](../../specs/README.md) and use `/speckit.specify` to bootstrap it.
  - type: input
    id: spec_link
    attributes:
      label: Spec link (optional)
      description: Link to the spec PR or draft, if already open.
      placeholder: "https://github.com/nash87/parkhub-php/pull/..."
